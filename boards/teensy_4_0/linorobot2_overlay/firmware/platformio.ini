; ---------------------------------------------------------------------------
; Based on linorobot2_hardware firmware/platformio.ini at aaf9d59 (Apache-2.0).
; MODIFIED by OpenAMRobot (2026): pins platform teensy@5.1.0 and every
; library to the versions in the deployed 2026-06-29 Teensy build
; (openamr-platform-fw #13). See docs/flashing/build-and-flash.md.
; MODIFIED by OpenAMRobot (22 Nov 2026): removed the upstream ESP32 build
; environments. They are not OpenAMRobot hardware and they pull in
; ESP32Servo (LGPL-2.1), which the Third-Party Material Policy does not
; accept linked into firmware.
; ---------------------------------------------------------------------------
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env]
platform = teensy@5.1.0
framework = arduino
upload_port = /dev/ttyACM0
upload_protocol = teensy-cli
board_microros_transport = serial # or wifi
board_microros_distro = ${sysenv.ROS_DISTRO}
lib_deps = https://github.com/micro-ROS/micro_ros_platformio#cfee17faffaa532363b7151dd13af6a85c69d3c1
    mcauser/i2cdetect@1.0.0
    jrowberg/I2Cdevlib-Core@1.0.1
    jrowberg/I2Cdevlib-ADXL345@1.0.0
    jrowberg/I2Cdevlib-AK8975@1.0.0
    jrowberg/I2Cdevlib-HMC5843@1.0.0
    jrowberg/I2Cdevlib-HMC5883L@1.0.0
    jrowberg/I2Cdevlib-ITG3200@1.0.0
    jrowberg/I2Cdevlib-MPU6050@1.0.0
    https://github.com/dthain/QMC5883L#a014ab62bb591759af0c6047cff32137872f4469
    https://github.com/wollewald/INA219_WE#c8a0d0645d8cc14ebd3d4bef130dc360e09139ad
    https://github.com/arcao/Syslog#e9c2eea7a91fdda3a55f9df2ebc122f3152da02d
    SPI
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit PWM Servo Driver Library@3.0.3
build_flags = -I ../config

[env:teensy41] 
board = teensy41

[env:teensy40] 
board = teensy40

[env:teensy36]
board = teensy36
build_flags = 
    -I ../config
    -llibc -lc

[env:teensy35]
board = teensy35
build_flags = 
    -I ../config
    -llibc -lc

[env:teensy31] 
board = teensy31
board_build.f_cpu = 96000000L
build_flags = 
    -I ../config
    -llibc -lc

[env:dev] 
board = teensy40
build_flags = 
    -I ../config
    -D USE_DEV_CONFIG

[env:vattenkar] 
board = teensy40
upload_port = /dev/linobase
build_flags = 
    -I ../config
    -D USE_VATTENKAR_CONFIG

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
upload_protocol = picotool
board_microros_user_meta = atomic.meta
lib_deps =
    ${env.lib_deps}
    https://github.com/gbr1/rp2040-encoder-library.git
build_flags =
    -I ../config
    -D PICO
    -D USE_PICO2_CONFIG

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
upload_protocol = picotool
board_microros_user_meta = atomic.meta
lib_deps =
    ${env.lib_deps}
    https://github.com/gbr1/rp2040-encoder-library.git
build_flags =
    -I ../config
    -D PICO
    -D USE_PICO_CONFIG

; add maintainer configurations above this line
; this barrier helps to reduce user merge conflict
; add user configurations below this line


