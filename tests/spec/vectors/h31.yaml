  - event: charge_cmd_removed
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
