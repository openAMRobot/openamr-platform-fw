# Test vector for specification review. Not firmware. Not a safety function.
# Format and the C adapter: docs/safety/spec/adapter.md
id: h22
title: Stale /cmd_vel gives zero with no latch and resumes on next fresh command; lost session latches
covers:
- T11
- R7
- H22
status: REV5
steps:
- t: 0.0
  events:
  - event: boot
    params:
      cause: POWER_ON
  inputs:
    run_ok: true
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_POWER_ON
- t: 0.1
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.2
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    first_reason: null
    reason_mask: []
- t: 0.25
  events:
  - event: motion_cmd
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: FOLLOW_CMD
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    results:
    - accepted
- t: 0.5
  events:
  - event: cmd_stale
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
  note: zero velocity, still RUN, latches untouched
- t: 0.55
  events:
  - event: motion_cmd
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: FOLLOW_CMD
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    results:
    - accepted
- t: 0.8
  events:
  - event: session_lost
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
