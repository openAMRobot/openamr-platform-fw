# Test vector for specification review. Not firmware. Not a safety function.
# Format and the C adapter: docs/safety/spec/adapter.md
id: h11
title: Both charger faults latched; each clears only when its own condition holds
covers:
- T9
- H11
- '5.3'
status: REV5
steps:
- t: 0.0
  events:
  - event: boot
    params:
      cause: POWER_ON
  inputs:
    run_ok: true
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_POWER_ON
- t: 0.1
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.2
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    first_reason: null
    reason_mask: []
- t: 0.4
  events:
  - event: safety_ok_low
  inputs:
    run_ok: false
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.5
  events:
  - event: charge_cmd
  expect:
    state: CHARGING
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'ON'
    motion_admissible: false
    results:
    - accepted
- t: 1.0
  events:
  - event: charge_interlock
  - event: wcm_fault
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      wcm_latched: true
      interlock_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    first_reason: CHARGER_FAULT
    reason_mask:
    - CHARGER_FAULT
    - CHARGE_INTERLOCK
  note: 'same tick: WCM_FAULT ranks before the interlock fault in the priority list'
- t: 1.1
  events:
  - event: charge_cmd_removed
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      wcm_latched: true
      interlock_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 1.2
  events:
  - event: reset_short
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      wcm_latched: true
      interlock_latched: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    results:
    - accepted
  note: short press acknowledges only; WCM still asserted so only the interlock clears
- t: 1.3
  events:
  - event: charger_ack
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      wcm_latched: true
      interlock_latched: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - CHARGER_ACK_REJECTED
    results:
    - rejected
- t: 1.4
  events:
  - event: wcm_fault_clear
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      wcm_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 1.5
  events:
  - event: charger_ack
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      wcm_latched: false
      interlock_latched: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    results:
    - accepted
- t: 1.6
  events:
  - event: wcm_fault
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - CHARGER_FAULT
  note: 'WCM returns between ack and second RESET: recorded, stays LOCKED'
- t: 1.7
  events:
  - event: charge_cmd
  inputs:
    charge_pre_ok: false
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - CHARGE_REJECTED
    results:
    - rejected
- t: 1.8
  events:
  - event: reset_short
  inputs:
    run_ok: true
    charge_pre_ok: true
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
  note: 'CONFLICT C3: rev 5 5.3 says WCM in LOCKED does not by itself block RUN'
