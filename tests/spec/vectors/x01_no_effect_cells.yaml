# Test vector for specification review. Not firmware. Not a safety function.
# Format and the C adapter: docs/safety/spec/adapter.md
id: x01_no_effect_cells
title: 'No-effect cells of the command table: RESET in RUN, INHIBITED and CHARGING; release in RUN; RESET in CHARGER_FAULT
  with charge command held; base motion outside CHARGING'
covers:
- 4 command table
- '5.1'
- '5.3'
- '5.6'
status: ADDED
added_reason: rev 5 H tests do not name these no-effect cells of the command table; added so every row is exercised
steps:
- t: 0.0
  events:
  - event: boot
    params:
      cause: POWER_ON
  inputs:
    run_ok: true
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_POWER_ON
- t: 0.1
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.2
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    first_reason: null
    reason_mask: []
- t: 0.25
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
  note: 'P6: no effect in RUN'
- t: 0.26
  events:
  - event: jetson_stop_release
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
  note: 'L2: no effect in RUN'
- t: 0.27
  events:
  - event: base_not_stopped
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
  note: 'N2: robot moving in RUN is not an event'
- t: 0.28
  events:
  - event: ui_stop
  expect:
    state: INHIBITED
    latches:
      reset_seen: true
      ui_stop: true
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.29
  events:
  - event: reset_short
  expect:
    state: INHIBITED
    latches:
      reset_seen: true
      ui_stop: true
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: false
  note: 'P6: no effect in INHIBITED'
- t: 0.295
  events:
  - event: ui_resume
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
- t: 0.3
  events:
  - event: safety_ok_low
  inputs:
    run_ok: false
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.4
  events:
  - event: charge_cmd
  expect:
    state: CHARGING
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'ON'
    motion_admissible: false
    results:
    - accepted
- t: 0.5
  events:
  - event: reset_short
  expect:
    state: CHARGING
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'ON'
    motion_admissible: false
  note: 'P6: no effect in CHARGING'
- t: 0.6
  events:
  - event: wcm_fault
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      wcm_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.7
  events:
  - event: reset_short
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      wcm_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - CHARGER_ACK_REJECTED
    results:
    - rejected
  note: 'P2: short press while the charge command is still held'
