# Test vector for specification review. Not firmware. Not a safety function.
# Format and the C adapter: docs/safety/spec/adapter.md
id: h27
title: 'Session rules: old-session Stop honoured; old Resume, release, charge and ack rejected SESSION_OLD; replays
  rejected'
covers:
- '3.1'
- H27
status: REV5
not_modelled: heartbeat or session start with a stale epoch is dropped (3.1); the event model has no session-start
  event. Owner adapter test.
steps:
- t: 0.0
  events:
  - event: boot
    params:
      cause: POWER_ON
  inputs:
    run_ok: true
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_POWER_ON
- t: 0.1
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
