  expect:
    state: INHIBITED
    latches:
      reset_seen: true
      ui_stop: true
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: false
  note: old-session Stop restricts motion only
