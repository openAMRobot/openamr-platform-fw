# Test vector for specification review. Not firmware. Not a safety function.
# Format and the C adapter: docs/safety/spec/adapter.md
id: h28
title: 'SAFETY_OK still high 500 ms after entering CHARGING, or high again 20 ms: CHARGER_FAULT (CHARGE_INTERLOCK)'
covers:
- T3
- T4
- H28
status: REV5
steps:
- t: 0.0
  events:
  - event: boot
    params:
      cause: POWER_ON
  inputs:
    run_ok: true
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_POWER_ON
- t: 0.1
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.2
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    first_reason: null
    reason_mask: []
- t: 0.3
  events:
  - event: safety_ok_low
  inputs:
    run_ok: false
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.4
  events:
  - event: charge_cmd
  expect:
    state: CHARGING
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'ON'
    motion_admissible: false
    results:
    - accepted
- t: 0.9
  events:
  - event: charge_interlock
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      interlock_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    first_reason: CHARGE_INTERLOCK
- t: 1.0
  events:
  - event: charge_cmd_removed
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      interlock_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 1.1
  events:
  - event: charger_ack
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      interlock_latched: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    results:
    - accepted
- t: 1.2
  events:
  - event: charge_cmd
  expect:
    state: CHARGING
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'ON'
    motion_admissible: false
    results:
    - accepted
- t: 1.25
  events: []
  expect:
    state: CHARGING
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'ON'
    motion_admissible: false
  note: 'a glitch shorter than 20 ms is ignored: no event'
- t: 1.3
  events:
  - event: estop_diag
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      interlock_latched: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    first_reason: ESTOP_DIAG
  note: 'stale diagnostic: LOCKED, not CHARGER_FAULT'
