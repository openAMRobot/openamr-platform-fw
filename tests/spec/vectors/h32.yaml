# Test vector for specification review. Not firmware. Not a safety function.
# Format and the C adapter: docs/safety/spec/adapter.md
id: h32
title: 'Charger acknowledgement: rejected while charge command held or WCM asserted; interlock ack with SAFETY_OK
  high; never arms'
covers:
- T9
- H32
status: REV5
open: 'Q6: WCM_FAULT asserting while already in CHARGER_FAULT (latched for CHARGE_INTERLOCK) is ''Stay'' in rev
  5; whether it also latches wcm_latched is not stated.'
steps:
- t: 0.0
  events:
  - event: boot
    params:
      cause: POWER_ON
  inputs:
    run_ok: true
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_POWER_ON
- t: 0.1
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.2
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    first_reason: null
    reason_mask: []
- t: 0.3
  events:
  - event: safety_ok_low
  inputs:
    run_ok: false
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.4
  events:
  - event: charge_cmd
  expect:
    state: CHARGING
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'ON'
    motion_admissible: false
    results:
    - accepted
- t: 0.5
  events:
  - event: charger_ack
  expect:
    state: CHARGING
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'ON'
    motion_admissible: false
    reasons:
    - CHARGER_ACK_REJECTED
    results:
    - rejected
  note: not in CHARGER_FAULT
- t: 0.9
  events:
  - event: charge_interlock
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      interlock_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.95
  events:
  - event: wcm_fault
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      wcm_latched: false
      interlock_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
  note: 'WCM after entry: recorded, not latched (W2)'
- t: 1.0
  events:
  - event: charger_ack
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      interlock_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - CHARGER_ACK_REJECTED
    results:
    - rejected
  note: charge command still held
- t: 1.1
  events:
  - event: charge_cmd_removed
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      interlock_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 1.2
  events:
  - event: charger_ack
  inputs:
    run_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      interlock_latched: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    results:
    - accepted
  note: interlock fault acknowledged with SAFETY_OK still high; ack never arms (reset_seen false, LOCKED)
- t: 1.3
  events:
  - event: charge_cmd
  expect:
    state: CHARGING
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'ON'
    motion_admissible: false
    results:
    - accepted
- t: 1.8
  events:
  - event: charge_interlock
  expect:
    state: CHARGER_FAULT
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
      interlock_latched: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
  note: next attempt detects the failed interlock again
