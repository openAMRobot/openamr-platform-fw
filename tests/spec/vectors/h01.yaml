# Test vector for specification review. Not firmware. Not a safety function.
# Format and the C adapter: docs/safety/spec/adapter.md
id: h01
title: Boot lands in LOCKED; RUN only after qualified RESET and Jetson Stop release; invalid input keeps LOCKED
covers:
- T1
- H1
status: REV5
steps:
- t: 0.0
  events:
  - event: boot
    params:
      cause: WATCHDOG
  inputs:
    run_ok: true
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_WATCHDOG
- t: 0.05
  events:
  - event: motion_cmd
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    results:
    - rejected
  note: no motion before RUN
- t: 0.1
  events:
  - event: reset_short
  expect:
    state: LOCKED
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
  note: armed but Jetson Stop still asserted
- t: 0.2
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
  note: the release alone never enters RUN (Q2)
- t: 0.25
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
  note: second press after the release; see owner question Q2
- t: 0.3
  events:
  - event: motion_cmd
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: FOLLOW_CMD
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    results:
    - accepted
- t: 1.0
  events:
  - event: boot
    params:
      cause: POWER_ON
  inputs:
    run_ok: false
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_POWER_ON
- t: 1.1
  events:
  - event: input_invalid
    params:
      subcause: MISSING
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - INPUT_INVALID:MISSING
- t: 1.2
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 1.3
  events:
  - event: reset_short
  expect:
    state: LOCKED
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
  note: 'input never valid: run_ok false keeps LOCKED'
