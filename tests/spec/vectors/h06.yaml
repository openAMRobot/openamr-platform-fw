# Test vector for specification review. Not firmware. Not a safety function.
# Format and the C adapter: docs/safety/spec/adapter.md
id: h06
title: 'Jetson silence in RUN: LOCKED, Jetson Stop asserted; old-session release rejected, new-session accepted'
covers:
- T5
- H6
- '3.1'
status: REV5
steps:
- t: 0.0
  events:
  - event: boot
    params:
      cause: POWER_ON
  inputs:
    run_ok: true
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_POWER_ON
- t: 0.1
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.2
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    first_reason: null
    reason_mask: []
- t: 0.3
  events:
  - event: ui_stop
  expect:
    state: INHIBITED
    latches:
      reset_seen: true
      ui_stop: true
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.4
  events:
  - event: session_lost
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: true
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    first_reason: COMMS_LOST
- t: 0.5
  events:
  - event: reset_short
  expect:
    state: LOCKED
    latches:
      reset_seen: true
      ui_stop: true
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
  note: RESET alone is not enough
- t: 0.6
  events:
  - event: jetson_stop_release
    params:
      session: old
  expect:
    state: LOCKED
    latches:
      reset_seen: true
      ui_stop: true
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - SESSION_OLD
    results:
    - rejected
  note: a delayed message with the old epoch is dropped
- t: 0.7
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: true
      ui_stop: true
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
  note: ui_stop is kept across the session loss
- t: 0.8
  events:
  - event: ui_resume
  expect:
    state: LOCKED
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
  note: Resume in LOCKED clears ui_stop only
- t: 0.9
  events:
  - event: motion_cmd
    params:
      queued: true
  expect:
    state: LOCKED
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    results:
    - rejected
- t: 1.0
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
  note: physical RESET after all releases
- t: 1.1
  events:
  - event: motion_cmd
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: FOLLOW_CMD
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    results:
    - accepted
