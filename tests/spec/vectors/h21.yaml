# Test vector for specification review. Not firmware. Not a safety function.
# Format and the C adapter: docs/safety/spec/adapter.md
id: h21
title: WCM_FAULT asserted in RUN or INHIBITED is recorded only
covers:
- T9
- H21
status: REV5
conflict: 'C5: H21 also says a charge-interlock fault while already inhibited latches normally; rev 5 defines it
  only in CHARGING. Not vectored.'
steps:
- t: 0.0
  events:
  - event: boot
    params:
      cause: POWER_ON
  inputs:
    run_ok: true
    arming_ok: true
    qualified: true
    base_stopped: true
    charge_pre_ok: true
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: true
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - BOOT_POWER_ON
- t: 0.1
  events:
  - event: jetson_stop_release
  expect:
    state: LOCKED
    latches:
      reset_seen: false
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'ON'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.2
  events:
  - event: reset_short
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    first_reason: null
    reason_mask: []
- t: 0.3
  events:
  - event: wcm_fault
  expect:
    state: RUN
    latches:
      reset_seen: true
      ui_stop: false
      jetson_stop: false
      wcm_latched: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: true
    reasons:
    - CHARGER_FAULT
- t: 0.4
  events:
  - event: ui_stop
  expect:
    state: INHIBITED
    latches:
      reset_seen: true
      ui_stop: true
      jetson_stop: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: false
- t: 0.5
  events:
  - event: wcm_fault
  expect:
    state: INHIBITED
    latches:
      reset_seen: true
      ui_stop: true
      jetson_stop: false
      wcm_latched: false
    outputs:
      motor: ZERO
      lamp: 'OFF'
      charge_request: 'OFF'
    motion_admissible: false
    reasons:
    - CHARGER_FAULT
