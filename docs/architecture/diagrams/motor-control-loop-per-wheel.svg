<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- FULL-CANVAS WHITE BACKGROUND -->
  <rect x="0" y="0" width="1360" height="800" fill="#ffffff"/>

  <text x="40" y="40" font-weight="700" font-size="20px" fill="#1a1a1a">Per-wheel velocity control loop — PID + feedforward + anti-windup</text>
  <text x="40" y="62" font-weight="400" font-size="12.5px" fill="#1a1a1a">one wheel · setpoint from /cmd_vel (inverse kinematics) · feedback from AS5040 encoder · discrete loop at 50 Hz (20 ms)</text>

  <!-- ===== LOOP-RATE BANNER ===== -->
  <rect x="1004" y="92" width="316" height="58" rx="8" fill="#f4f8fd" stroke="#2c6fbb" stroke-width="1.6"/>
  <circle cx="1030" cy="121" r="12" fill="#ffffff" stroke="#2c6fbb" stroke-width="1.6"/>
  <line x1="1030" y1="121" x2="1030" y2="113" stroke="#2c6fbb" stroke-width="1.6"/>
  <line x1="1030" y1="121" x2="1036" y2="124" stroke="#2c6fbb" stroke-width="1.6"/>
  <text x="1052" y="116" font-weight="700" font-size="12.5px" fill="#1a1a1a">Discrete control loop</text>
  <text x="1052" y="134" font-size="11.5px" fill="#1a1a1a">runs at 50 Hz  ·  20 ms period</text>

  <!-- ===== FEEDFORWARD (addition) ===== -->
  <rect x="460" y="110" width="200" height="60" rx="10" fill="#eefaf3" stroke="#2e8b57" stroke-width="1.8"/>
  <text x="560" y="135" text-anchor="middle" font-weight="700" font-size="13px" fill="#1a1a1a">Feedforward  Kff</text>
  <text x="560" y="153" text-anchor="middle" font-size="11px" fill="#1a1a1a">(feedforward + dither)</text>
  <text x="672" y="140" font-weight="700" font-size="10.5px" fill="#2e8b57">＋ added vs plain PID</text>

  <!-- ===== FORWARD PATH BLOCKS ===== -->
  <!-- Input -->
  <rect x="40" y="196" width="160" height="68" rx="10" fill="#f4f8fd" stroke="#2c6fbb" stroke-width="1.6"/>
  <text x="120" y="220" text-anchor="middle" font-weight="700" font-size="12.5px" fill="#1a1a1a">Target wheel velocity</text>
  <text x="120" y="238" text-anchor="middle" font-size="11px" fill="#1a1a1a">from /cmd_vel</text>
  <text x="120" y="254" text-anchor="middle" font-size="11px" fill="#1a1a1a">(inverse kinematics)</text>

  <!-- Sum 1 -->
  <circle cx="250" cy="230" r="22" fill="#ffffff" stroke="#2c6fbb" stroke-width="2"/>
  <text x="250" y="236" text-anchor="middle" font-weight="700" font-size="17px" fill="#1a1a1a">&#931;</text>
  <text x="231" y="224" font-weight="700" font-size="12px" fill="#2c6fbb">+</text>
  <text x="245" y="258" font-weight="700" font-size="13px" fill="#c0392b">&#8722;</text>

  <!-- PID -->
  <rect x="310" y="196" width="200" height="68" rx="10" fill="#f4f8fd" stroke="#2c6fbb" stroke-width="1.6"/>
  <text x="410" y="217" text-anchor="middle" font-weight="700" font-size="13px" fill="#1a1a1a">PID controller</text>
  <text x="410" y="235" text-anchor="middle" font-size="11px" fill="#1a1a1a">Kp 2.0 · Ki 0.1 · Kd 0.1</text>
  <text x="410" y="253" text-anchor="middle" font-weight="700" font-size="10.5px" fill="#2e8b57">+ back-calc anti-windup</text>

  <!-- Sum 2 -->
  <circle cx="560" cy="230" r="22" fill="#ffffff" stroke="#2c6fbb" stroke-width="2"/>
  <text x="560" y="236" text-anchor="middle" font-weight="700" font-size="17px" fill="#1a1a1a">&#931;</text>
  <text x="541" y="224" font-weight="700" font-size="12px" fill="#2c6fbb">+</text>
  <text x="566" y="214" font-weight="700" font-size="12px" fill="#2e8b57">+</text>

  <!-- PWM output -->
  <rect x="620" y="196" width="160" height="68" rx="10" fill="#f4f8fd" stroke="#2c6fbb" stroke-width="1.6"/>
  <text x="700" y="224" text-anchor="middle" font-weight="700" font-size="12.5px" fill="#1a1a1a">PWM output</text>
  <text x="700" y="244" text-anchor="middle" font-size="11px" fill="#1a1a1a">bounded (saturation)</text>

  <!-- ZBLD driver -->
  <rect x="820" y="196" width="130" height="68" rx="10" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.6"/>
  <text x="885" y="226" text-anchor="middle" font-weight="700" font-size="12.5px" fill="#1a1a1a">ZBLD driver</text>
  <text x="885" y="244" text-anchor="middle" font-size="10.5px" fill="#c0392b">24 V power</text>

  <!-- BLDC motor -->
  <rect x="980" y="196" width="130" height="68" rx="10" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.6"/>
  <text x="1045" y="226" text-anchor="middle" font-weight="700" font-size="12.5px" fill="#1a1a1a">BLDC motor</text>
  <text x="1045" y="244" text-anchor="middle" font-size="10.5px" fill="#1a1a1a">ZD Z4BLD60</text>

  <!-- Wheel -->
  <rect x="1150" y="196" width="110" height="68" rx="10" fill="#f4f4f4" stroke="#444444" stroke-width="1.6"/>
  <text x="1205" y="234" text-anchor="middle" font-weight="700" font-size="13px" fill="#1a1a1a">Wheel</text>

  <!-- ===== FEEDBACK BLOCKS ===== -->
  <rect x="380" y="530" width="180" height="64" rx="10" fill="#f6f6f6" stroke="#888888" stroke-width="1.6"/>
  <text x="470" y="556" text-anchor="middle" font-weight="700" font-size="12.5px" fill="#1a1a1a">Measured RPM</text>
  <text x="470" y="574" text-anchor="middle" font-size="10.5px" fill="#1a1a1a">to sum junction</text>

  <rect x="620" y="530" width="200" height="64" rx="10" fill="#f6f6f6" stroke="#888888" stroke-width="1.6"/>
  <text x="720" y="556" text-anchor="middle" font-weight="700" font-size="12.5px" fill="#1a1a1a">Ripple-correction table</text>
  <text x="720" y="574" text-anchor="middle" font-size="10.5px" fill="#1a1a1a">runtime lookup</text>

  <rect x="880" y="530" width="140" height="64" rx="10" fill="#f6f6f6" stroke="#888888" stroke-width="1.6"/>
  <text x="950" y="556" text-anchor="middle" font-weight="700" font-size="12.5px" fill="#1a1a1a">Quadrature</text>
  <text x="950" y="574" text-anchor="middle" font-size="11px" fill="#1a1a1a">counts</text>

  <rect x="1080" y="530" width="140" height="64" rx="10" fill="#f6f6f6" stroke="#888888" stroke-width="1.6"/>
  <text x="1150" y="556" text-anchor="middle" font-weight="700" font-size="12.5px" fill="#1a1a1a">AS5040</text>
  <text x="1150" y="574" text-anchor="middle" font-size="11px" fill="#1a1a1a">encoder</text>

  <!-- ===== FORWARD ARROWS (blue) ===== -->
  <line x1="200" y1="230" x2="228" y2="230" stroke="#2c6fbb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="272" y1="230" x2="310" y2="230" stroke="#2c6fbb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="291" y="222" text-anchor="middle" font-size="10.5px" fill="#2c6fbb">error</text>
  <line x1="510" y1="230" x2="538" y2="230" stroke="#2c6fbb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="582" y1="230" x2="620" y2="230" stroke="#2c6fbb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="601" y="222" text-anchor="middle" font-size="10.5px" fill="#2c6fbb">u</text>
  <line x1="780" y1="230" x2="820" y2="230" stroke="#2c6fbb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="800" y="222" text-anchor="middle" font-size="10.5px" fill="#2c6fbb">PWM</text>
  <line x1="950" y1="230" x2="980" y2="230" stroke="#c0392b" stroke-width="2" marker-end="url(#ab)"/>
  <text x="965" y="222" text-anchor="middle" font-size="10px" fill="#c0392b">phases</text>
  <line x1="1110" y1="230" x2="1150" y2="230" stroke="#444444" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1130" y="222" text-anchor="middle" font-size="10px" fill="#444444">torque</text>

  <!-- ===== FEEDFORWARD WIRING (blue in, green sum) ===== -->
  <circle cx="214" cy="230" r="3.2" fill="#2c6fbb"/>
  <polyline points="214,230 214,140 460,140" fill="none" stroke="#2c6fbb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="300" y="132" text-anchor="middle" font-size="10.5px" fill="#2c6fbb">setpoint feedforward</text>
  <line x1="560" y1="170" x2="560" y2="208" stroke="#2e8b57" stroke-width="2" marker-end="url(#ab)"/>
  <text x="568" y="192" font-size="10.5px" fill="#2e8b57">+ Kff</text>

  <!-- ===== ANTI-WINDUP (green) ===== -->
  <circle cx="700" cy="264" r="3.2" fill="#2e8b57"/>
  <polyline points="700,264 700,340 410,340 410,264" fill="none" stroke="#2e8b57" stroke-width="2" marker-end="url(#ab)"/>
  <text x="555" y="333" text-anchor="middle" font-size="10.5px" fill="#2e8b57">back-calculation anti-windup:  ( u_sat &#8722; u )  &#8594;  integrator</text>

  <!-- ===== FEEDBACK PATH (grey) ===== -->
  <!-- wheel -> encoder (sense) -->
  <polyline points="1205,264 1205,505 1150,505 1150,530" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1214" y="400" font-size="10.5px" fill="#888888">shaft rotation</text>
  <!-- encoder -> counts -->
  <line x1="1080" y1="562" x2="1020" y2="562" stroke="#888888" stroke-width="2" marker-end="url(#ab)"/>
  <text x="1050" y="552" text-anchor="middle" font-size="10px" fill="#888888">A/B</text>
  <!-- counts -> ripple table -->
  <line x1="880" y1="562" x2="820" y2="562" stroke="#888888" stroke-width="2" marker-end="url(#ab)"/>
  <text x="850" y="552" text-anchor="middle" font-size="10px" fill="#888888">counts</text>
  <!-- ripple -> measured RPM -->
  <line x1="620" y1="562" x2="560" y2="562" stroke="#888888" stroke-width="2" marker-end="url(#ab)"/>
  <text x="590" y="552" text-anchor="middle" font-size="10px" fill="#888888">corrected</text>
  <!-- measured RPM -> sum 1 (minus) -->
  <polyline points="380,562 250,562 250,252" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#ab)"/>
  <text x="315" y="554" text-anchor="middle" font-size="10.5px" fill="#888888">measured RPM</text>

  <!-- ===== COLOUR LEGEND ===== -->
  <rect x="40" y="670" width="720" height="100" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
  <text x="56" y="694" font-weight="700" font-size="12.5px" fill="#1a1a1a">Colour legend</text>
  <line x1="56" y1="714" x2="82" y2="714" stroke="#2c6fbb" stroke-width="3"/>
  <text x="90" y="718" font-size="11.5px" fill="#1a1a1a">control signal · 3.3 V logic</text>
  <line x1="56" y1="736" x2="82" y2="736" stroke="#c0392b" stroke-width="3"/>
  <text x="90" y="740" font-size="11.5px" fill="#1a1a1a">power stage · 24 V (driver, motor)</text>
  <line x1="56" y1="758" x2="82" y2="758" stroke="#888888" stroke-width="3"/>
  <text x="90" y="762" font-size="11.5px" fill="#1a1a1a">feedback / measurement data</text>
  <line x1="400" y1="714" x2="426" y2="714" stroke="#2e8b57" stroke-width="3"/>
  <text x="434" y="718" font-weight="700" font-size="11.5px" fill="#1a1a1a">additions over a plain PID</text>
  <text x="434" y="740" font-size="11.5px" fill="#1a1a1a">= feedforward (Kff + dither)</text>
  <text x="434" y="758" font-size="11.5px" fill="#1a1a1a">+ back-calculation anti-windup</text>

  <!-- ===== SUMMARY NOTE ===== -->
  <rect x="790" y="670" width="530" height="100" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
  <text x="806" y="694" font-weight="700" font-size="12.5px" fill="#1a1a1a">Loop summary</text>
  <text x="806" y="716" font-size="11.5px" fill="#1a1a1a">error = setpoint &#8722; measured RPM  &#8594;  PID  &#8594;  + Kff  &#8594;  bounded PWM.</text>
  <text x="806" y="736" font-size="11.5px" fill="#1a1a1a">Encoder counts pass a runtime ripple-correction table before becoming RPM.</text>
  <text x="806" y="756" font-size="11.5px" fill="#1a1a1a">Everything inside the loop is recomputed once every 20 ms (50 Hz).</text>
</svg>
