name: Firmware host modules

# Builds and runs every portable firmware module test project found under tests/host/<name>/
# (one CMake project per module, warnings as errors, ASan and UBSan as each project sets them)
# and the specification checks under tests/spec. A branch without these folders passes with
# "nothing to run", so the job can be a required check.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "firmware/**"
      - "tests/host/**"
      - "tests/spec/**"
      - "tools/spec/**"
      - "docs/safety/spec/**"
      - ".github/workflows/firmware-host-modules.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "tests/host/**"
      - "tests/spec/**"
      - "tools/spec/**"
      - "docs/safety/spec/**"

permissions:
  contents: read

jobs:
  host-modules:
    name: Host module tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc python3-pytest python3-yaml
          gcc --version | head -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build and run each tests/host project
        run: |
          set -euo pipefail
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          found=0
          for proj in tests/host/*/CMakeLists.txt; do
            [ -f "$proj" ] || continue
            found=1
            dir=$(dirname "$proj"); name=$(basename "$dir")
            echo "::group::$name"
            cmake -S "$dir" -B "build/host/$name" -G Ninja
            cmake --build "build/host/$name" 2>&1 | tee "build/host/$name.log"
            if grep -E ': warning:' "build/host/$name.log"; then
              echo "::error::Compiler warnings in $name"; exit 1
            fi
            ctest --test-dir "build/host/$name" --output-on-failure --no-tests=error | tee "build/host/$name.ctest"
            echo "::endgroup::"
            echo "- \`$name\`: $(grep -E 'tests passed' "build/host/$name.ctest" | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$found" = 1 ] || echo "- no tests/host projects on this branch: nothing to run" >> "$GITHUB_STEP_SUMMARY"

      - name: Specification checks
        run: |
          set -euo pipefail
          if [ -d tests/spec ]; then
            python3 -m pytest -q tests/spec | tee spec.log
            echo "- \`tests/spec\`: $(tail -1 spec.log)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- no tests/spec on this branch: nothing to run" >> "$GITHUB_STEP_SUMMARY"
          fi
