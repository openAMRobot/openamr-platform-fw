name: Firmware host tests

on:
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "boards/teensy_4_0/**"
      - ".github/workflows/firmware-host-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - "boards/teensy_4_0/**"
      - ".github/workflows/firmware-host-tests.yml"

permissions:
  contents: read

jobs:
  host-tests:
    name: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install numpy==2.2.6

      - name: Run tests (an empty suite fails)
        run: python -m unittest discover -s tests -v
