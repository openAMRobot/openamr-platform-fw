name: Firmware host C/C++ tests

# Host-side C/C++ unit tests (GoogleTest, ASan + UBSan) and static analysis (cppcheck, clang-format).
# Layer 1: GitHub-hosted runners only, no hardware, no secrets. tools/ci/** is included in the
# paths because the checkers this workflow runs live there.
on:
  pull_request:
    paths:
      - "boards/**"
      - "firmware/**"
      - "tests/**"
      - "tools/ci/**"
      - ".github/workflows/firmware-host-cpp.yml"
  push:
    branches: [main]
    paths:
      - "boards/**"
      - "firmware/**"
      - "tests/**"
      - "tools/ci/**"
      - ".github/workflows/firmware-host-cpp.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # linorobot2_hardware branch jazzy, the base pinned in NOTICE.md (same as the Teensy Gate A build)
  UPSTREAM_SHA: aaf9d59cd18c0cd1905be6fdae9ea5c99961a766
  # Ubuntu 24.04 (noble) archive versions
  APT_GTEST: libgtest-dev=1.14.0-1 googletest=1.14.0-1
  APT_STATIC: cppcheck=2.13.0-2ubuntu3 clang-format-18=1:18.1.3-1ubuntu1

jobs:
  host-cpp:
    name: host-cpp (GoogleTest, ASan, UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out linorobot2_hardware at the pinned base (upstream PID reference)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: linorobot/linorobot2_hardware
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false

      - name: Install GoogleTest (pinned Ubuntu package)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_GTEST ninja-build
          {
            echo "### Host C/C++ toolchain"
            echo '```'
            dpkg-query -W libgtest-dev googletest ninja-build
            g++ --version | head -1
            cmake --version | head -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure and build (-Wall -Wextra -Werror, ASan + UBSan)
        run: |
          cmake -S tests/host -B build/host -G Ninja -DLINOROBOT2_HARDWARE_DIR="$GITHUB_WORKSPACE/upstream"
          cmake --build build/host

      - name: Run tests (zero tests fails)
        run: |
          set -o pipefail
          ctest --test-dir build/host --output-on-failure --no-tests=error | tee build/host/ctest.log
          { echo '```'; tail -n 8 build/host/ctest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Every skip names a tracking issue
        run: python3 tools/ci/check_skips.py tests

      - name: Mutation check (each mutation of the overlay PID must fail a test)
        run: |
          set -o pipefail
          bash tests/host/mutation_check.sh "$GITHUB_WORKSPACE/upstream" build/mutation | tee build/mutation.log
          { echo '### Mutation check'; echo '```'; cat build/mutation.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  static-analysis:
    name: static-analysis (cppcheck, clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install cppcheck and clang-format (pinned Ubuntu packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_STATIC
          { echo "### Static analysis tools"; echo '```'; dpkg-query -W cppcheck clang-format-18; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Tool self-tests (an empty suite fails)
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/static -v 2>&1 | tee "$RUNNER_TEMP/static.log"
          grep -qE '^Ran [1-9][0-9]* tests?' "$RUNNER_TEMP/static.log"
        env:
          CLANG_FORMAT: clang-format-18

      - name: cppcheck (overlay, boards/stm32/*/Core, firmware/; Drivers and upstream excluded)
        run: python3 tools/ci/run_cppcheck.py --root . --work build/cppcheck

      - name: clang-format (firmware/ only)
        run: bash tools/ci/check_format.sh firmware
        env:
          CLANG_FORMAT: clang-format-18
