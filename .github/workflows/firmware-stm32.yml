name: Firmware STM32H723 build

# Runs only where the STM32 project exists (boards/stm32/). Workflow edits are exercised
# by the next pull request that touches boards/stm32/, or manually on such a branch.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "boards/stm32/**"
  push:
    branches: [main]
    paths:
      - "boards/stm32/**"

permissions:
  contents: read

env:
  # openamr-platform-hw commit whose interfaces/electrical/base-controller-io.yaml the .ioc is
  # checked against. Set the repository variable HW_CONTRACT_SHA to pin it; default: hw main.
  HW_CONTRACT_REF: ${{ vars.HW_CONTRACT_SHA || 'main' }}

jobs:
  stm32h723:
    name: STM32H723 ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]
    defaults:
      run:
        working-directory: boards/stm32/OpenAMRobot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Arm GNU toolchain
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
          arm-none-eabi-gcc --version | head -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log

      - name: No compiler warnings in project code
        run: |
          if grep -E '(Core|firmware)/[^:]*:[0-9]+:[0-9]+: warning:' build.log; then
            echo "::error::Compiler warnings in project code (vendored Drivers are not checked)"
            exit 1
          fi

      - name: Check out the controller I/O contract (openamr-platform-hw)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openAMRobot/openamr-platform-hw
          ref: ${{ env.HW_CONTRACT_REF }}
          path: .hw
          sparse-checkout: interfaces/electrical
          persist-credentials: false

      - name: Install pinned Python packages
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-deps PyYAML==6.0.3

      - name: CubeMX .ioc against the controller I/O contract
        working-directory: .
        run: |
          contract=.hw/interfaces/electrical/base-controller-io.yaml
          hw_sha=$(git -C .hw rev-parse HEAD)
          if [ ! -f "$contract" ]; then
            echo "::warning title=ioc contract::NOT RUN: no $contract at openamr-platform-hw $hw_sha"
            echo "NOT RUN: ioc contract check, no base-controller-io.yaml at openamr-platform-hw $hw_sha" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          for ioc in boards/stm32/*/*.ioc; do
            "$RUNNER_TEMP/venv/bin/python" tools/ci/check_ioc_contract.py "$ioc" --contract "$contract" \
              --contract-sha "$hw_sha" --json "build-ioc-contract-$(basename "$ioc" .ioc).json" || status=1
          done
          echo "ioc contract check against openamr-platform-hw $hw_sha: $([ $status = 0 ] && echo PASS || echo FAIL)" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Vendored ST files against the upstream release (Debug leg only)
        if: matrix.preset == 'Debug'
        working-directory: .
        run: python3 tools/ci/check_vendor_provenance.py --cache "$RUNNER_TEMP/vendor-upstream"

      - name: Ethernet DMA descriptors in RAM_D2
        run: python3 ../../../tools/ci/check_dma_placement.py build/${{ matrix.preset }}/OpenAMRobot.elf

      - name: Size report
        run: |
          {
            echo "### STM32H723 ${{ matrix.preset }}"
            echo '```'
            arm-none-eabi-size build/${{ matrix.preset }}/OpenAMRobot.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stm32h723-${{ matrix.preset }}
          path: |
            boards/stm32/OpenAMRobot/build/${{ matrix.preset }}/OpenAMRobot.elf
            boards/stm32/OpenAMRobot/build/${{ matrix.preset }}/OpenAMRobot.map
            boards/stm32/OpenAMRobot/build.log
          if-no-files-found: error
