name: can_sil

# Runs the tools/can_sil emulator suite on a real Linux vcan0 interface.
# Emulator and test tooling only: not simulation, physical or safety acceptance.

on:
  pull_request:
    paths:
      - "tools/can_sil/**"
      - ".github/workflows/can-sil.yml"
  push:
    branches: [main]
    paths:
      - "tools/can_sil/**"
      - ".github/workflows/can-sil.yml"

permissions:
  contents: read

jobs:
  can-sil:
    name: can_sil (vcan0)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create vcan0
        run: |
          set -eu
          if ! sudo modprobe vcan; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -br link show vcan0
      - name: Install test requirements (as in tools/can_sil/README.md)
        run: python -m pip install "python-can==4.6.1" "pytest==9.1.1"
      - name: can_sil suite
        run: python -m pytest tools/can_sil/tests -q -p no:cacheprovider -rs
