name: Firmware Teensy Gate A build

on:
  pull_request:
    paths:
      - "boards/teensy_4_0/**"
      - ".github/workflows/firmware-teensy-gate-a.yml"
  push:
    branches: [main]
    paths:
      - "boards/teensy_4_0/**"
      - ".github/workflows/firmware-teensy-gate-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teensy40:
    name: teensy40 (linorobot2 overlay)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ROS_DISTRO: jazzy
      # linorobot2_hardware branch jazzy, the base pinned in NOTICE.md
      UPSTREAM_SHA: aaf9d59cd18c0cd1905be6fdae9ea5c99961a766
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out linorobot2_hardware at the pinned base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: linorobot/linorobot2_hardware
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.platformio
            upstream/firmware/.pio
          key: pio-teensy40-${{ env.UPSTREAM_SHA }}-${{ hashFiles('boards/teensy_4_0/**') }}
          restore-keys: pio-teensy40-${{ env.UPSTREAM_SHA }}-

      - name: Install PlatformIO in its own environment (micro_ros_platformio needs ~/.platformio/penv)
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/python -m pip install platformio==6.1.18
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"

      - name: Apply the OpenAMRobot overlay
        run: |
          overlay=boards/teensy_4_0/linorobot2_overlay
          cp "$overlay/config/lino_base_config.h" upstream/config/lino_base_config.h
          cp "$overlay/lib/pid/pid.cpp" upstream/firmware/lib/pid/pid.cpp
          cp "$overlay/src/firmware.ino" upstream/firmware/src/firmware.ino

      - name: Build teensy40
        working-directory: upstream/firmware
        run: |
          set -o pipefail
          if ! pio run -e teensy40 2>&1 | tee build.log; then
            # one annotation with the log tail, so the cause is readable without downloading logs
            tail -n 80 build.log | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error title=pio run failed::' + t)"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teensy40-firmware
          path: |
            upstream/firmware/.pio/build/teensy40/firmware.hex
            upstream/firmware/.pio/build/teensy40/firmware.elf
          if-no-files-found: error
